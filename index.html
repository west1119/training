<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>微積トレーナー</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --surface: #ffffff;
      --ink: #18202f;
      --muted: #667085;
      --line: #d9dee8;
      --accent: #166c76;
      --accent-soft: #e2f4f5;
      --ok: #1f8a4c;
      --bad: #c24135;
      --warn: #a05a00;
      --shadow: 0 10px 30px rgba(24, 32, 47, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 3;
      background: rgba(247, 248, 251, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(217, 222, 232, 0.75);
    }

    .topbar {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 16px 10px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 800;
    }

    .subtitle {
      margin: 4px 0 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 4px;
      background: #e9edf4;
      border-radius: 8px;
    }

    .tab {
      min-height: 40px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #344054;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.15;
      padding: 6px 4px;
    }

    .tab.active {
      background: var(--surface);
      color: var(--accent);
      box-shadow: 0 1px 4px rgba(24, 32, 47, 0.12);
    }

    main {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
      flex: 1;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .panel,
    .formula-item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 16px;
    }

    .practice-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .mode-label {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .score {
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .problem {
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      padding: 18px;
      border-radius: 8px;
      background: #f3f6fa;
      border: 1px solid #e2e7ef;
    }

    .prompt {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .expression {
      margin: 0;
      font-size: 24px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .answer-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 14px;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      margin-top: 10px;
    }

    .key {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
      color: var(--ink);
      font-weight: 800;
      font-size: 15px;
      line-height: 1;
    }

    .key.wide {
      grid-column: span 2;
    }

    input {
      min-width: 0;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      background: var(--surface);
      color: var(--ink);
    }

    input:focus {
      outline: 3px solid rgba(22, 108, 118, 0.16);
      border-color: var(--accent);
    }

    .primary,
    .secondary {
      min-height: 48px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-weight: 800;
      padding: 0 14px;
    }

    .primary {
      color: white;
      background: var(--accent);
    }

    .secondary {
      color: var(--accent);
      background: var(--surface);
      border-color: var(--line);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .feedback {
      min-height: 56px;
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }

    .feedback.ok {
      border-color: rgba(31, 138, 76, 0.35);
      background: #edf8f1;
      color: var(--ok);
    }

    .feedback.bad {
      border-color: rgba(194, 65, 53, 0.35);
      background: #fff1ef;
      color: var(--bad);
    }

    .feedback.hint {
      border-color: rgba(160, 90, 0, 0.32);
      background: #fff8eb;
      color: var(--warn);
    }

    .formula-list {
      display: grid;
      gap: 10px;
    }

    .formula-item {
      padding: 14px;
      box-shadow: none;
    }

    .formula-item h2 {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.35;
    }

    .formula-item p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }

    .formula {
      display: block;
      margin-top: 6px;
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .note {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    @media (max-width: 390px) {
      .topbar,
      main {
        padding-left: 12px;
        padding-right: 12px;
      }

      .tab {
        font-size: 11px;
      }

      .answer-row {
        grid-template-columns: 1fr;
      }

      .primary,
      .secondary {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="topbar">
        <h1>微積トレーナー</h1>
        <p class="subtitle">大学1年レベルの微分・積分を、練習できます。</p>
        <nav class="tabs" aria-label="機能切り替え">
          <button class="tab active" data-view="diff-practice">微分<br>練習</button>
          <button class="tab" data-view="int-practice">積分<br>練習</button>
          <button class="tab" data-view="diff-formulas">微分<br>公式</button>
          <button class="tab" data-view="int-formulas">積分<br>公式</button>
        </nav>
      </div>
    </header>

    <main>
      <section id="diff-practice" class="view active">
        <div class="panel" data-practice="diff">
          <div class="practice-head">
            <p class="mode-label">微分練習モード</p>
            <div class="score" id="diff-score">0 / 0</div>
          </div>
          <div class="problem">
            <p class="prompt">次の関数を x で微分せよ。</p>
            <p class="expression" id="diff-question"></p>
          </div>
          <div class="answer-row">
            <input id="diff-answer" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" placeholder="例: 3x^2 + 2x">
            <button class="primary" data-check="diff">判定</button>
          </div>
          <div class="keypad" aria-label="微分の入力補助">
            <button class="key" data-insert="diff" data-value="^">^</button>
            <button class="key" data-insert="diff" data-value="(">(</button>
            <button class="key" data-insert="diff" data-value=")">)</button>
            <button class="key" data-insert="diff" data-value="/">/</button>
            <button class="key" data-insert="diff" data-value="*">*</button>
            <button class="key" data-insert="diff" data-value="+">+</button>
            <button class="key" data-insert="diff" data-value="-">-</button>
            <button class="key" data-insert="diff" data-value="x">x</button>
            <button class="key" data-insert="diff" data-value="e^x">e^x</button>
            <button class="key" data-insert="diff" data-value="log(x)">log</button>
          </div>
          <div class="actions">
            <button class="secondary" data-hint="diff">ヒント</button>
            <button class="secondary" data-next="diff">次の問題</button>
          </div>
          <div class="feedback" id="diff-feedback">答えを入力して「判定」を押してください。sin(x), cos(x), e^x, log(x), C などが使えます。</div>
        </div>
      </section>

      <section id="int-practice" class="view">
        <div class="panel" data-practice="int">
          <div class="practice-head">
            <p class="mode-label">積分練習モード</p>
            <div class="score" id="int-score">0 / 0</div>
          </div>
          <div class="problem">
            <p class="prompt">次の不定積分を求めよ。</p>
            <p class="expression" id="int-question"></p>
          </div>
          <div class="answer-row">
            <input id="int-answer" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" placeholder="例: x^3 + C">
            <button class="primary" data-check="int">判定</button>
          </div>
          <div class="keypad" aria-label="積分の入力補助">
            <button class="key" data-insert="int" data-value="^">^</button>
            <button class="key" data-insert="int" data-value="(">(</button>
            <button class="key" data-insert="int" data-value=")">)</button>
            <button class="key" data-insert="int" data-value="/">/</button>
            <button class="key" data-insert="int" data-value="*">*</button>
            <button class="key" data-insert="int" data-value="+">+</button>
            <button class="key" data-insert="int" data-value="-">-</button>
            <button class="key" data-insert="int" data-value="x">x</button>
            <button class="key" data-insert="int" data-value="C">C</button>
            <button class="key" data-insert="int" data-value="log(x)">log</button>
          </div>
          <div class="actions">
            <button class="secondary" data-hint="int">ヒント</button>
            <button class="secondary" data-next="int">次の問題</button>
          </div>
          <div class="feedback" id="int-feedback">積分定数 C も入力できます。省略しても正解にする問題があります。</div>
        </div>
      </section>

      <section id="diff-formulas" class="view">
        <p class="note">微分で最初に固めたい公式・定理のまとめです。</p>
        <div class="formula-list" id="diff-formula-list"></div>
      </section>

      <section id="int-formulas" class="view">
        <p class="note">積分でよく使う形を、置換・部分積分へ進む前の基礎としてまとめています。</p>
        <div class="formula-list" id="int-formula-list"></div>
      </section>
    </main>
  </div>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["\\(", "\\)"]],
        displayMath: [["\\[", "\\]"]]
      },
      svg: {
        fontCache: "global"
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <script>
    const problems = {
      diff: [
        {
          q: "f(x) = 3x^4 - 5x^2 + 7x - 1",
          latex: "f(x)=3x^4-5x^2+7x-1",
          latexAnswer: "12x^3-10x+7",
          answers: ["12x^3-10x+7"],
          hint: "x^n の微分は n*x^(n-1)。定数の微分は 0 です。"
        },
        {
          q: "f(x) = (2x - 1)(x^2 + 3)",
          latex: "f(x)=(2x-1)(x^2+3)",
          latexAnswer: "6x^2-2x+6",
          answers: ["6x^2-2x+6"],
          hint: "展開してから微分しても、積の微分法を使っても解けます。"
        },
        {
          q: "f(x) = sin(x) + 2cos(x)",
          latex: "f(x)=\\sin x+2\\cos x",
          latexAnswer: "\\cos x-2\\sin x",
          answers: ["cos(x)-2sin(x)"],
          hint: "sin(x)' = cos(x), cos(x)' = -sin(x)。"
        },
        {
          q: "f(x) = e^x + log(x)",
          latex: "f(x)=e^x+\\log x",
          latexAnswer: "e^x+\\frac{1}{x}",
          answers: ["e^x+1/x"],
          hint: "e^x は微分しても e^x、log(x) の微分は 1/x です。"
        },
        {
          q: "f(x) = (x^2 + 1)^5",
          latex: "f(x)=(x^2+1)^5",
          latexAnswer: "10x(x^2+1)^4",
          answers: ["10x(x^2+1)^4", "10x*(x^2+1)^4"],
          hint: "合成関数の微分。外側を微分して、内側 x^2+1 の微分を掛けます。"
        },
        {
          q: "f(x) = x^2 e^x",
          latex: "f(x)=x^2e^x",
          latexAnswer: "e^x(x^2+2x)",
          answers: ["2xe^x+x^2e^x", "e^x(x^2+2x)", "x^2e^x+2xe^x"],
          hint: "積の微分法: (fg)' = f'g + fg'。"
        },
        {
          q: "f(x) = 1 / x^3",
          latex: "f(x)=\\frac{1}{x^3}",
          latexAnswer: "-\\frac{3}{x^4}",
          answers: ["-3/x^4", "-3x^-4"],
          hint: "1/x^3 を x^-3 と見て微分します。"
        },
        {
          q: "f(x) = tan(x)",
          latex: "f(x)=\\tan x",
          latexAnswer: "\\sec^2 x",
          answers: ["1/cos(x)^2", "sec(x)^2"],
          hint: "tan(x)' = 1/cos^2(x) = sec^2(x)。"
        }
      ],
      int: [
        {
          q: "∫ (4x^3 - 6x + 2) dx",
          latex: "\\int (4x^3-6x+2)\\,dx",
          latexAnswer: "x^4-3x^2+2x+C",
          answers: ["x^4-3x^2+2x+C", "x^4-3x^2+2x"],
          hint: "x^n の積分は x^(n+1)/(n+1)。項ごとに積分します。"
        },
        {
          q: "∫ 1/x dx",
          latex: "\\int \\frac{1}{x}\\,dx",
          latexAnswer: "\\log |x|+C",
          answers: ["log|x|+C", "log(x)+C", "log|x|", "log(x)", "ln|x|+C", "ln(x)+C", "ln|x|", "ln(x)"],
          hint: "1/x の積分は対数です。厳密には log|x| + C。"
        },
        {
          q: "∫ cos(x) dx",
          latex: "\\int \\cos x\\,dx",
          latexAnswer: "\\sin x+C",
          answers: ["sin(x)+C", "sin(x)"],
          hint: "微分して cos(x) になる関数を探します。"
        },
        {
          q: "∫ e^x dx",
          latex: "\\int e^x\\,dx",
          latexAnswer: "e^x+C",
          answers: ["e^x+C", "e^x"],
          hint: "e^x は積分しても e^x です。"
        },
        {
          q: "∫ 2x(x^2 + 1)^4 dx",
          latex: "\\int 2x(x^2+1)^4\\,dx",
          latexAnswer: "\\frac{(x^2+1)^5}{5}+C",
          answers: ["(x^2+1)^5/5+C", "1/5(x^2+1)^5+C", "(x^2+1)^5/5", "1/5(x^2+1)^5"],
          hint: "u = x^2 + 1 と置くと du = 2x dx です。"
        },
        {
          q: "∫ x e^(x^2) dx",
          latex: "\\int xe^{x^2}\\,dx",
          latexAnswer: "\\frac{1}{2}e^{x^2}+C",
          answers: ["e^(x^2)/2+C", "1/2e^(x^2)+C", "e^(x^2)/2", "1/2e^(x^2)"],
          hint: "u = x^2 と置くと du = 2x dx。係数 1/2 に注意します。"
        },
        {
          q: "∫ sin(3x) dx",
          latex: "\\int \\sin(3x)\\,dx",
          latexAnswer: "-\\frac{1}{3}\\cos(3x)+C",
          answers: ["-cos(3x)/3+C", "-1/3cos(3x)+C", "-cos(3x)/3", "-1/3cos(3x)"],
          hint: "cos(3x) を微分すると -3sin(3x) です。"
        },
        {
          q: "∫ x log(x) dx",
          latex: "\\int x\\log x\\,dx",
          latexAnswer: "\\frac{x^2}{2}\\log x-\\frac{x^2}{4}+C",
          answers: ["x^2log(x)/2-x^2/4+C", "1/2x^2log(x)-1/4x^2+C", "x^2log(x)/2-x^2/4", "x^2ln(x)/2-x^2/4+C", "1/2x^2ln(x)-1/4x^2+C", "x^2ln(x)/2-x^2/4"],
          hint: "部分積分を使います。u = log(x), dv = x dx と置くのが定番です。"
        }
      ]
    };

    const formulas = {
      diff: [
        ["べき関数", "n が実数のとき", "\\frac{d}{dx}x^n=nx^{n-1}"],
        ["線形性", "和・差・定数倍は分けて微分できます。", "\\{af(x)+bg(x)\\}'=af'(x)+bg'(x)"],
        ["積の微分法", "2つの関数の積を微分するときに使います。", "(fg)'=f'g+fg'"],
        ["商の微分法", "分母に関数があるときの基本公式です。", "\\left(\\frac{f}{g}\\right)'=\\frac{f'g-fg'}{g^2}"],
        ["合成関数の微分", "大学初年級で最重要の公式の一つです。", "\\{f(g(x))\\}'=f'(g(x))g'(x)"],
        ["三角関数", "符号を間違えやすいので反復練習が有効です。", "(\\sin x)'=\\cos x,\\quad (\\cos x)'=-\\sin x,\\quad (\\tan x)'=\\frac{1}{\\cos^2 x}"],
        ["指数・対数", "自然対数と自然指数は頻出です。", "(e^x)'=e^x,\\quad (\\log x)'=\\frac{1}{x}"],
        ["平均値の定理", "増減・不等式・近似の根拠になります。", "f(b)-f(a)=f'(c)(b-a)\\quad (a<c<b)"]
      ],
      int: [
        ["べき関数", "n ≠ -1 のときに使います。", "\\int x^n\\,dx=\\frac{x^{n+1}}{n+1}+C"],
        ["対数型", "1/x は別扱いです。", "\\int \\frac{1}{x}\\,dx=\\log|x|+C"],
        ["線形性", "和・差・定数倍は分けて積分できます。", "\\int\\{af(x)+bg(x)\\}\\,dx=a\\int f(x)\\,dx+b\\int g(x)\\,dx"],
        ["三角関数", "微分公式を逆向きに使います。", "\\int\\sin x\\,dx=-\\cos x+C,\\quad \\int\\cos x\\,dx=\\sin x+C"],
        ["指数関数", "e^x は特に扱いやすい関数です。", "\\int e^x\\,dx=e^x+C,\\quad \\int a^x\\,dx=\\frac{a^x}{\\log a}+C"],
        ["置換積分", "合成関数の微分の逆操作です。", "u=g(x),\\quad du=g'(x)\\,dx"],
        ["部分積分", "積の微分法の逆操作です。", "\\int f'(x)g(x)\\,dx=f(x)g(x)-\\int f(x)g'(x)\\,dx"],
        ["積分定数", "不定積分では必ず意識します。", "\\int f'(x)\\,dx=f(x)+C"]
      ]
    };

    const state = {
      diff: { index: 0, correct: 0, total: 0 },
      int: { index: 0, correct: 0, total: 0 }
    };

    function normalize(value) {
      return value
        .toLowerCase()
        .replaceAll(" ", "")
        .replaceAll("　", "")
        .replaceAll("＊", "*")
        .replaceAll("−", "-")
        .replaceAll("＋", "+")
        .replaceAll("（", "(")
        .replaceAll("）", ")")
        .replaceAll("ｘ", "x")
        .replaceAll("ln", "log")
        .replace(/\*+/g, "")
        .replace(/\+c$/i, "")
        .replace(/^\+/, "");
    }

    function currentProblem(type) {
      return problems[type][state[type].index];
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function typesetMath(root = document.body) {
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([root]);
      }
    }

    function renderProblem(type) {
      const p = currentProblem(type);
      const question = document.getElementById(`${type}-question`);
      question.innerHTML = `\\(${p.latex}\\)`;
      document.getElementById(`${type}-answer`).value = "";
      const feedback = document.getElementById(`${type}-feedback`);
      feedback.className = "feedback";
      feedback.textContent = type === "diff"
        ? "答えを入力して「判定」を押してください。"
        : "答えを入力して「判定」を押してください。積分定数 C は省略しても正解になる問題があります。";
      typesetMath(question);
    }

    function updateScore(type) {
      document.getElementById(`${type}-score`).textContent = `${state[type].correct} / ${state[type].total}`;
    }

    function checkAnswer(type) {
      const input = document.getElementById(`${type}-answer`);
      const feedback = document.getElementById(`${type}-feedback`);
      const answer = normalize(input.value);
      const p = currentProblem(type);
      const accepted = p.answers.map(normalize);

      if (!answer) {
        feedback.className = "feedback hint";
        feedback.textContent = "まず答えを入力してみましょう。";
        return;
      }

      state[type].total += 1;
      if (accepted.includes(answer)) {
        state[type].correct += 1;
        feedback.className = "feedback ok";
        feedback.textContent = "正解です。いい調子です。";
      } else {
        feedback.className = "feedback bad";
        feedback.innerHTML = `惜しいです。正答例: \\(${p.latexAnswer}\\)`;
        typesetMath(feedback);
      }
      updateScore(type);
    }

    function showHint(type) {
      const feedback = document.getElementById(`${type}-feedback`);
      feedback.className = "feedback hint";
      feedback.textContent = currentProblem(type).hint;
    }

    function nextProblem(type) {
      state[type].index = (state[type].index + 1) % problems[type].length;
      renderProblem(type);
    }

    function insertToken(type, token) {
      const input = document.getElementById(`${type}-answer`);
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? input.value.length;
      input.value = `${input.value.slice(0, start)}${token}${input.value.slice(end)}`;
      const nextPosition = start + token.length;
      input.focus();
      input.setSelectionRange(nextPosition, nextPosition);
    }

    function renderFormulas(type) {
      const list = document.getElementById(`${type}-formula-list`);
      list.innerHTML = formulas[type].map(([title, body, formula]) => `
        <article class="formula-item">
          <h2>${escapeHtml(title)}</h2>
          <p>${escapeHtml(body)}<span class="formula">\\(${escapeHtml(formula)}\\)</span></p>
        </article>
      `).join("");
      typesetMath(list);
    }

    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((tab) => tab.classList.remove("active"));
        document.querySelectorAll(".view").forEach((view) => view.classList.remove("active"));
        button.classList.add("active");
        document.getElementById(button.dataset.view).classList.add("active");
      });
    });

    document.querySelectorAll("[data-check]").forEach((button) => {
      button.addEventListener("click", () => checkAnswer(button.dataset.check));
    });

    document.querySelectorAll("[data-next]").forEach((button) => {
      button.addEventListener("click", () => nextProblem(button.dataset.next));
    });

    document.querySelectorAll("[data-hint]").forEach((button) => {
      button.addEventListener("click", () => showHint(button.dataset.hint));
    });

    document.querySelectorAll("[data-insert]").forEach((button) => {
      button.addEventListener("click", () => insertToken(button.dataset.insert, button.dataset.value));
    });

    document.querySelectorAll("input").forEach((input) => {
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          const type = input.id.startsWith("diff") ? "diff" : "int";
          checkAnswer(type);
        }
      });
    });

    renderProblem("diff");
    renderProblem("int");
    renderFormulas("diff");
    renderFormulas("int");
  </script>
</body>
</html>
